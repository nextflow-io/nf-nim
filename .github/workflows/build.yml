name: CI Build
on:
  push:
    branches:
      - '**'
      - '!refs/tags/.*'
    tags-ignore:
      - "**"
    paths-ignore:
      - "docs/**"
      - "*.md"
  pull_request:
    types: [opened, reopened, synchronize]
    paths-ignore:
      - "docs/**"
      - "*.md"

jobs:
  build:
    name: Build
    if: ${{ !contains(github.event.head_commit.message , '[ci skip]') && (github.event_name == 'push' || github.repository != github.event.pull_request.head.repo.full_name) }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # ratchet:actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # ratchet:actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@ac2d340dc04d9e1113182899e983b5400c17cda1 # ratchet:gradle/gradle-build-action@v3

      - name: Build the plugin
        run: ./gradlew assemble

      - name: Run unit tests
        run: ./gradlew test --exclude-task NIMIntegrationTest

      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # ratchet:actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: |
            **/build/reports/tests/test
